<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1, shrink-to-fit=no"
        />
        <meta name="description" content="Third project for Hexlet.io" />
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet"
            integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
            crossorigin="anonymous"
        />
        <link
            rel="shortcut icon"
            href="{{ url_for('static', filename='favicon.ico') }}"
        />
        <title>{{ _('Page Analyzer') }}</title>
    </head>
    <body class="min-vh-100 d-flex flex-column">
        <header class="flex-shrink-0">
            <nav class="navbar navbar-expand-md navbar-dark bg-dark px-3">
                <a class="navbar-brand" href="/">{{ _('Page Analyzer') }}</a>
                <div id="navbarNav">
                    <ul class="navbar-nav">
                        <li class="nav-item">
                            <a class="nav-link" href="/urls"
                                >{{ _('Sites') }}</a
                            >
                        </li>
                    </ul>
                </div>
                <div class="ms-auto">
                    <a
                        href="/set_language/en"
                        class="btn btn-sm btn-outline-light me-1"
                        >EN</a
                    >
                    <a
                        href="/set_language/ru"
                        class="btn btn-sm btn-outline-light"
                        >RU</a
                    >
                </div>
            </nav>
        </header>
        {% with messages = get_flashed_messages(with_categories=true) %} {% if
        messages %} {% for category, message in messages %}
        <div
            class="alert alert-{{ 'danger' if category == 'danger' else 'info' if category == 'info' else 'success' }} alert-dismissible fade show"
            role="alert"
        >
            {{ message }}
        </div>
        {% endfor %} {% endif %} {% endwith %}
        <main class="flex-grow-1">{% block content %}{% endblock %}</main>
    </body>
</html>
